#
# Nginx 配置: Chatjoy 反向代理 + Sticky Session
#
# 安装:
#   sudo apt install nginx
#   sudo cp nginx_agentscope.conf /etc/nginx/sites-available/chatjoy
#   sudo ln -sf /etc/nginx/sites-available/chatjoy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意: 如果使用域名 + HTTPS，请替换 server_name 和添加 ssl 配置
#

upstream agentscope_backend {
    # ip_hash 保证同一客户端 IP 始终路由到同一 Worker
    # 这确保了:
    #   1. WebSocket 连接的生命周期内不会漂移
    #   2. LRU Cache 中的 Agent/Mem0 对象能被复用
    #   3. 无需 Redis Pub/Sub 做跨 Worker 消息转发
    ip_hash;

    # Gunicorn workers 监听在 127.0.0.1:8001
    # Gunicorn 自己做端口复用，所有 Worker 共享同一个端口
    # 所以这里只需一个 server 条目
    server 127.0.0.1:8001;
}

server {
    listen 80;
    # 如果有域名，取消注释下面的行
    # server_name your-domain.com;

    # 客户端上传限制 (聊天中可能有图片/文件)
    client_max_body_size 50m;

    # ============= HTTP/REST API =============

    location / {
        proxy_pass http://agentscope_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置 — AI 模型响应可能较慢
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ============= SSE (Server-Sent Events) =============

    location /agent_chat {
        proxy_pass http://agentscope_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须禁用缓冲
        proxy_buffering off;
        proxy_cache off;

        # SSE 可能持续很长时间
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ============= WebSocket =============

    location /ws/ {
        proxy_pass http://agentscope_backend;
        proxy_http_version 1.1;

        # WebSocket 升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        # 注意: 如果应用层有心跳，可以设得长一些
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ============= 静态文件 (可选: 直接由 Nginx 服务) =============

    # 如果想让 Nginx 直接服务静态文件以减轻 Gunicorn 负担，
    # 取消注释以下配置并修改路径:
    #
    # location /web/ {
    #     alias /home/ps/tzy/Chatjoy2.0/web/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
}
