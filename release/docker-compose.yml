services:

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      function: "AI-character-project_overseas"
      com.app.function: "ai-character-project_overseas"
      app_stack_name: "redis"

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: postgres
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "35432:5432"
    labels:
      function: "AI-character-project_overseas"
      com.app.function: "ai-character-project_overseas"
      app_stack_name: "pgvector"

  # ── Application ───────────────────────────────────────────────────────────
  app:
    build: .
    image: chatjoy:2.0
    restart: unless-stopped
    ports:
      - "9002:8001"
    env_file: .env
    environment:
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@pgvector:5432/postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NO_PROXY: "localhost,127.0.0.1,redis,pgvector"
    volumes:
      - chatjoy_characters:/app/characters
      - chatjoy_data:/app/data
      - chatjoy_logs:/app/logs
      - chatjoy_user_profiles:/app/user_profiles
      # fastembed 模型缓存（首次启动自动下载 ~600 MB，之后复用）
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/detailed', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      function: "AI-character-project_overseas"
      com.app.function: "ai-character-project_overseas"
      app_stack_name: "ai-app"


volumes:
  chatjoy_user_profiles:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/chatjoy/user_profiles
  chatjoy_characters:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/chatjoy/characters
  chatjoy_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/chatjoy/data
  chatjoy_logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/chatjoy/logs
  redis_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/redis/data
  pgvector_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/pgvector/data
  fastembed_cache:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /data/docker-compose_data/ai-character-project_overseas/fastembed/cache


