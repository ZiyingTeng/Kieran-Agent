<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI女友聊天系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .top-bar {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .top-bar .title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .user-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-control input {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            width: 180px;
            outline: none;
        }

        .user-control button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-control button:hover {
            background: rgba(255,255,255,0.35);
        }

        /* 模型控制面板 */
        .model-control {
            position: relative;
        }

        .model-control-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .model-control-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        .model-control-btn .current-model {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .model-panel {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 20px;
            min-width: 300px;
            display: none;
            z-index: 1000;
        }

        .model-panel.active {
            display: block;
        }

        .model-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
        }

        .model-option {
            margin-bottom: 15px;
        }

        .model-option label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .model-option select,
        .model-option input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .model-option select:focus,
        .model-option input:focus {
            border-color: #ff6b9d;
        }

        .model-info {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .api-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .api-toggle label {
            font-size: 13px;
            color: #666;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #ff6b9d;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        /* 主容器 */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* 左侧女友列表 */
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            display: flex;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        .girlfriend-list {
            flex: 1;
            overflow-y: auto;
        }

        .girlfriend-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .girlfriend-item:hover {
            background: #f8f8f8;
        }

        .girlfriend-item.active {
            background: #fff0f5;
        }

        .girlfriend-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .girlfriend-item.system .girlfriend-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .girlfriend-item.custom .girlfriend-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .girlfriend-info {
            flex: 1;
            min-width: 0;
        }

        .girlfriend-name {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }


        .girlfriend-item.active .girlfriend-name {
            color: #c44569;
        }

        .unread-badge {
            background: #ff4757;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* 添加女友按钮 */
        .add-girlfriend-btn {
            padding: 15px 20px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }

        .add-girlfriend-btn button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-girlfriend-btn button:hover {
            transform: scale(1.02);
        }

        /* 群组列表样式 */
        .group-list {
            flex: 1;
            overflow-y: auto;
        }

        .group-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .group-item:hover {
            background: #f8f8f8;
        }

        .group-item.active {
            background: #fff0f5;
        }

        .group-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .group-info {
            flex: 1;
            min-width: 0;
        }

        .group-name {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .group-item.active .group-name {
            color: #c44569;
        }

        .group-members {
            font-size: 12px;
            color: #999;
        }

        .delete-group-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .delete-group-btn:hover {
            background: #fee;
            opacity: 1;
            transform: scale(1.1);
        }

        .add-group-btn {
            padding: 15px 20px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }

        .add-group-btn button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-group-btn button:hover {
            transform: scale(1.02);
        }

        /* 右侧聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }

        .chat-header {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header .chat-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .chat-header .chat-info p {
            font-size: 12px;
            color: #999;
        }

        .chat-header .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .chat-header .chat-actions button {
            padding: 6px 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #666;
        }

        .chat-header .chat-actions button:hover {
            background: #e0e0e0;
        }

        /* 设置下拉菜单 */
        .settings-dropdown {
            position: relative;
        }

        .settings-btn {
            width: 36px !important;
            height: 36px !important;
            padding: 0 !important;
            font-size: 20px !important;
            font-weight: bold !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: #f0f0f0 !important;
            border: none !important;
            border-radius: 50% !important;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: #e0e0e0 !important;
            transform: rotate(90deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            min-width: 180px;
            overflow: hidden;
            display: none;
            z-index: 1000;
            animation: dropdownFadeIn 0.2s ease;
        }

        .dropdown-menu.show {
            display: block;
        }

        @keyframes dropdownFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            color: #333;
        }

        .dropdown-item:hover {
            background: #f5f5f5;
        }

        .dropdown-item.danger {
            color: #e74c3c;
        }

        .dropdown-item.danger:hover {
            background: #fee;
        }

        .dropdown-divider {
            height: 1px;
            background: #f0f0f0;
            margin: 4px 0;
        }

        /* 消息区域 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
            margin-right: 10px;
        }

        .message.user .message-avatar {
            order: 2;
            margin-right: 0;
            margin-left: 10px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
        }

        .message-content {
            max-width: 60%;
            position: relative;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.assistant .message-bubble {
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            padding: 0 4px;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* 消息操作按钮 */
        .message-actions {
            position: absolute;
            right: -10px;
            bottom: -10px;
            display: flex;
            gap: 8px;
            background: white;
            padding: 6px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-content {
            position: relative;
        }

        .message.assistant:hover .message-actions {
            opacity: 1;
        }

        .message-actions button {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .message-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-edit {
            background: #f0f0f0;
            color: #333;
        }

        .btn-edit:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .btn-save {
            background: #4CAF50;
            color: white;
        }

        .btn-save:hover:not(:disabled) {
            background: #45a049;
            transform: scale(1.05);
        }

        .btn-cancel {
            background: #f44336;
            color: white;
        }

        .btn-cancel:hover:not(:disabled) {
            background: #da190b;
            transform: scale(1.05);
        }

        .btn-regenerate {
            background: #2196F3;
            color: white;
        }

        .btn-regenerate:hover:not(:disabled) {
            background: #0b7dda;
            transform: scale(1.05);
        }

        /* 编辑对话框 */
        .edit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .edit-dialog {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .edit-dialog h3 {
            margin: 0 0 16px 0;
            color: #333;
            font-size: 18px;
        }

        .edit-dialog textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            font-family: inherit;
            resize: vertical;
            outline: none;
            margin-bottom: 16px;
        }

        .edit-dialog textarea:focus {
            border-color: #45a049;
        }

        .edit-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .edit-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            z-index: 10000;
            animation: slideIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 输入区域 */
        .input-area {
            padding: 15px 20px;
            background: #fff;
            border-top: 1px solid #e0e0e0;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-container textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-container textarea:focus {
            border-color: #ff6b9d;
        }

        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* @按钮 */
        .mention-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            margin-right: 10px;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .mention-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mention-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .mention-btn:hover::before {
            opacity: 1;
        }

        .mention-btn:active {
            transform: translateY(0);
        }

        /* 当有@的角色时，按钮显示高亮效果 */
        .mention-btn.has-mentions {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
            }
            50% {
                box-shadow: 0 2px 16px rgba(236, 72, 153, 0.4);
            }
        }

        /* @的角色标签 */
        .mentioned-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 16px;
            min-height: 0;
        }

        .mention-tag {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.25);
            backdrop-filter: blur(10px);
        }

        .mention-tag .remove-mention {
            margin-left: 8px;
            cursor: pointer;
            opacity: 0.7;
            font-weight: bold;
            font-size: 16px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .mention-tag .remove-mention:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-10px);

        /* 加载动画 */

            display: none;
            padding: 10px 16px;

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }

        /* 空状态 */

            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;

        /* 创建女友模态框 */

            </div>
            <div class="modal-body">
                <div id="mentionCharacterList" style="max-height: 300px; overflow-y: auto;">
                    <!-- 动态加载群组成员 -->
                </div>
            </div>
            <div class="modal-footer">

                <button class="btn btn-primary" id="confirmMentionBtn">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const API_URL = window.location.origin;

        // 状态
        let currentUserId = 'user_001';
        let currentGirlfriendId = null;
        let currentSessionId = null;
        let currentGirlfriendName = '';
        let girlfriends = [];
        let messageCount = 0;

        // 模型相关状态
        let selectedModel = '';  // 选中的模型ID，空字符串表示使用默认模型
        let customApiPath = '';  // 自定义API路径
        let useAigirlApi = true;  // 是否使用AIGirl兼容API（默认启用，支持Ollama等更多模型）
        let availableModels = [];  // 可用模型列表

        // 群聊相关状态
        let currentGroupId = null;
        let currentGroupName = '';
        let groups = [];
        let isGroupChat = false;  // 当前是否在群聊模式

        // @功能相关状态
        let mentionedGirlfriends = [];  // 已@的角色列表

        // 保存每个女友的聊天记录和会话ID {girlfriend_id: {sessionId, messages: []}}
        let girlfriendChats = {};

        // DOM 元素
        const userIdInput = document.getElementById('userIdInput');
        const switchUserBtn = document.getElementById('switchUserBtn');
        const girlfriendList = document.getElementById('girlfriendList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatName = document.getElementById('chatName');
        const chatStatus = document.getElementById('chatStatus');
        const chatAvatar = document.getElementById('chatAvatar');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const typingIndicator = document.getElementById('typingIndicator');
        const messageCountEl = document.getElementById('messageCount');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // @功能相关DOM元素
        const mentionBtn = document.getElementById('mentionBtn');
        const mentionedTags = document.getElementById('mentionedTags');
        const mentionModal = document.getElementById('mentionModal');
        const mentionCharacterList = document.getElementById('mentionCharacterList');
        const closeMentionModal = document.getElementById('closeMentionModal');
        const confirmMentionBtn = document.getElementById('confirmMentionBtn');
        const cancelMentionBtn = document.getElementById('cancelMentionBtn');

        // 模型控制相关DOM元素
        const modelControlBtn = document.getElementById('modelControlBtn');
        const modelPanel = document.getElementById('modelPanel');
        const modelSelect = document.getElementById('modelSelect');
        const modelDescription = document.getElementById('modelDescription');
        const customApiSection = document.getElementById('customApiSection');
        const customApiPathInput = document.getElementById('customApiPath');
        const useAigirlApiCheckbox = document.getElementById('useAigirlApi');
        const currentModelDisplay = document.getElementById('currentModelDisplay');
        const testApiBtn = document.getElementById('testApiBtn');
        const testResult = document.getElementById('testResult');

        // 从localStorage恢复会话状态
        function restoreSessionState() {
            const savedState = localStorage.getItem(`chat_state_${currentUserId}`);
            if (savedState) {
                try {
                    return JSON.parse(savedState);
                } catch (e) {
                    console.error('解析会话状态失败:', e);
                }
            }
            return {};
        }

        // 保存会话状态到localStorage
        function saveSessionState(girlfriendId, sessionId) {
            const state = restoreSessionState();
            state[girlfriendId] = { sessionId, timestamp: Date.now() };
            localStorage.setItem(`chat_state_${currentUserId}`, JSON.stringify(state));
        }

        // 初始化
        async function init() {
            await loadGirlfriends();
            await loadGroups();  // 加载群组列表
            checkConnection();
            initModelControl();  // 初始化模型控制

            // 初始化所有女友的 girlfriendChats 对象
            girlfriends.forEach(gf => {
                if (!girlfriendChats[gf.girlfriend_id]) {
                    girlfriendChats[gf.girlfriend_id] = {};
                }
            });

            // 恢复上次的会话状态
            const savedState = restoreSessionState();
            for (const [girlfriendId, sessionInfo] of Object.entries(savedState)) {
                if (sessionInfo.sessionId) {
                    if (!girlfriendChats[girlfriendId]) {
                        girlfriendChats[girlfriendId] = {};
                    }
                    girlfriendChats[girlfriendId].sessionId = sessionInfo.sessionId;
                }
            }
        }

        // 加载群组列表
        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/groups?user_id=${currentUserId}`);
                if (response.ok) {
                    const data = await response.json();
                    groups = data.groups || [];
                    renderGroupList();
                }
            } catch (error) {
                console.error('加载群组列表失败:', error);
            }
        }

        // ============= 模型控制相关函数 =============

        // 加载可用模型列表
        async function loadModels() {
            try {
                const response = await fetch(`${API_URL}/api/models`);
                const data = await response.json();

                if (data.success && data.models) {
                    availableModels = data.models;
                    renderModelOptions(data.models);
                    updateCurrentModelDisplay(data.current_model);
                }
            } catch (error) {
                console.error('加载模型列表失败:', error);
            }
        }

        // 渲染模型选项
        function renderModelOptions(models) {
            modelSelect.innerHTML = '<option value="">使用默认模型</option>';

            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = `${model.description} ${model.is_default ? '(默认)' : ''}`;
                option.dataset.description = model.description;
                option.dataset.requiresApiKey = model.requires_api_key;
                modelSelect.appendChild(option);
            });

            // 监听模型选择变化
            modelSelect.addEventListener('change', (e) => {
                selectedModel = e.target.value;
                const selectedOption = e.target.options[e.target.selectedIndex];

                // 更新模型描述
                modelDescription.textContent = selectedOption.dataset.description || '';

                // 如果选择的是需要自定义API的模型，显示API路径输入框
                if (selectedModel && selectedOption.dataset.requiresApiKey === 'false') {
                    customApiSection.style.display = 'block';
                } else {
                    customApiSection.style.display = 'none';
                }

                updateCurrentModelDisplay(selectedModel || '默认模型');
                saveModelSettings();
            });
        }

        // 更新当前模型显示
        function updateCurrentModelDisplay(modelId) {
            if (!modelId || modelId === '默认模型') {
                currentModelDisplay.textContent = '默认模型';
                return;
            }

            const model = availableModels.find(m => m.id === modelId);
            if (model) {
                // 截断过长的描述
                const displayText = model.description.length > 15
                    ? model.description.substring(0, 15) + '...'
                    : model.description;
                currentModelDisplay.textContent = displayText;
            }
        }

        // 保存模型设置到localStorage
        function saveModelSettings() {
            const settings = {
                selectedModel,
                customApiPath: customApiPathInput.value,
                useAigirlApi: useAigirlApiCheckbox.checked
            };
            localStorage.setItem('model_settings', JSON.stringify(settings));
        }

        // 加载模型设置
        function loadModelSettings() {
            const saved = localStorage.getItem('model_settings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    selectedModel = settings.selectedModel || '';
                    customApiPath = settings.customApiPath || '';
                    useAigirlApi = settings.useAigirlApi || false;

                    // 恢复UI状态
                    if (selectedModel) {
                        modelSelect.value = selectedModel;
                        const selectedOption = modelSelect.options[modelSelect.selectedIndex];
                        if (selectedOption) {
                            modelDescription.textContent = selectedOption.dataset.description || '';
                            if (selectedOption.dataset.requiresApiKey === 'false') {
                                customApiSection.style.display = 'block';
                            }
                        }
                        updateCurrentModelDisplay(selectedModel);
                    }

                    if (customApiPath) {
                        customApiPathInput.value = customApiPath;
                    }

                    useAigirlApiCheckbox.checked = useAigirlApi;
                } catch (e) {
                    console.error('加载模型设置失败:', e);
                }
            }
        }

        // 初始化模型控制
        function initModelControl() {
            // 加载模型列表
            loadModels();

            // 加载保存的设置
            loadModelSettings();

            // 模型控制按钮点击事件

                    method: 'POST',
                    headers: {

        // 选择女友
        async function selectGirlfriend(gf) {
            // 退出群聊模式
            isGroupChat = false;
            currentGroupId = null;

            // 保存当前女友的会话信息（如果有）
            if (currentGirlfriendId && currentSessionId) {
                if (!girlfriendChats[currentGirlfriendId]) {
                    girlfriendChats[currentGirlfriendId] = {};
                }
                girlfriendChats[currentGirlfriendId].sessionId = currentSessionId;
                // 消息已经在DOM中，不需要额外保存
            }

            // 切换到新女友
            currentGirlfriendId = gf.girlfriend_id;
            currentGirlfriendName = gf.name;
            messageCount = 0;

            // 更新UI
            document.querySelectorAll('.girlfriend-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.girlfriendId === gf.girlfriend_id) {
                    item.classList.add('active');
                }
            });
            document.querySelectorAll('.group-item').forEach(item => {
                item.classList.remove('active');
            });

            // 更新聊天头部
            chatName.textContent = gf.name;
            chatStatus.textContent = '在线';
            chatAvatar.textContent = gf.name.charAt(0);

            // 显示清空记录按钮，隐藏群组设置菜单
            document.getElementById('clearHistoryBtn').style.display = 'block';
            document.getElementById('groupSettingsDropdown').style.display = 'none';

            // 清空消息区域
            messagesContainer.innerHTML = '';

            // 从PostgreSQL加载历史记录（持久化，刷新页面后恢复）
            try {
                const history = await loadHistoryFromBackend(currentUserId, gf.girlfriend_id);

                if (history.length > 0) {
                    // 显示历史消息
                    history.forEach(msg => {
                        const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('zh-CN', {
                            hour: '2-digit',
                            minute: '2-digit'
                        }) : formatTime(new Date());
                        restoreMessage(msg.role, msg.content, time);
                    });
                    messageCount = history.length;
                    console.log(`✅ 恢复了 ${history.length} 条历史记录`);
                } else {
                    // 无历史记录，显示欢迎消息
                    addMessage('assistant', `你好！我是${gf.name}，很高兴认识你！有什么想聊的吗？`);
                    messageCount = 0;
                }
            } catch (error) {
                console.error('加载历史记录失败:', error);
                // 加载失败时显示欢迎消息
                addMessage('assistant', `你好！我是${gf.name}，很高兴认识你！有什么想聊的吗？`);
                messageCount = 0;
            }

            // 更新状态
            updateMessageCount();
            messageInput.focus();

            // 滚动到底部
            setTimeout(() => scrollToBottom(true), 100);
        }

        // 从后端加载历史记录（使用user_id和expertId）

                if (response.ok) {
                    const data = await response.json();
                    return data.history || [];
                } else {
                    console.warn('获取历史记录失败:', response.status);
                    return [];

            } catch (error) {
                console.error('加载历史记录出错:', error);
                return [];
            }

            if (role === 'assistant') {

            const messageContent = document.createElement('div');

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

                `;
                messageContent.appendChild(actionsDiv);
            }

            message.appendChild(avatar);
            message.appendChild(messageContent);

            messagesContainer.appendChild(message);
            scrollToBottom(false);  // 立即滚动到底部

            // 保存消息到聊天记录
            if (currentGirlfriendId) {
                if (!girlfriendChats[currentGirlfriendId]) {
                    girlfriendChats[currentGirlfriendId] = { messages: [] };
                }
                if (!girlfriendChats[currentGirlfriendId].messages) {
                    girlfriendChats[currentGirlfriendId].messages = [];
                }
                girlfriendChats[currentGirlfriendId].messages.push({
                    role: role,
                    content: content,
                    time: currentTime,
                    msgId: message.dataset.msgId
                });
            }

            messageCount++;
            updateMessageCount();
        }

        // 格式化时间
        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');

        }

        // 保存私聊编辑
        async function savePrivateEdit(msgId, newContent) {
            const message = document.querySelector(`[data-msg-id="${msgId}"]`);
            if (!message) return;

            newContent = newContent.trim();
            if (!newContent) {
                showToast('❌ 回复内容不能为空');
                return;
            }

            const oldContent = message.dataset.content;
            const girlfriendId = message.dataset.girlfriendId;
            const girlfriend = girlfriends.find(g => g.id === girlfriendId);
            const girlfriendName = girlfriend ? girlfriend.name : 'AI助手';

            // 确认对话框
            if (!confirm(`确定要保存修改后的回复吗？\n\n原回复：${oldContent.substring(0, 50)}...\n\n新回复：${newContent.substring(0, 50)}...`)) {
                return;
            }

            try {
                // 调用后端API更新历史记录
                const response = await fetch(`${API_URL}/api/roles/update_history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        expertId: girlfriendId,
                        mes: getLastUserMessage(),
                        replay: newContent
                    })
                });

                const result = await response.json();
                if (result.success) {
                    // 更新界面
                    message.dataset.content = newContent;
                    message.querySelector('.message-bubble').textContent = newContent;
                    closeAllEditDialogs();
                    showToast('✅ 保存成功');
                } else {
                    showToast('❌ 保存失败：' + result.msg);
                }
            } catch (error) {
                console.error('保存失败:', error);
                showToast('❌ 保存失败：' + error.message);
            }
        }

        // 重新生成私聊消息
        async function regeneratePrivateMessage(msgId) {
            const message = document.querySelector(`[data-msg-id="${msgId}"]`);
            if (!message) return;

            const girlfriendId = message.dataset.girlfriendId;
            const girlfriend = girlfriends.find(g => g.id === girlfriendId);
            const girlfriendName = girlfriend ? girlfriend.name : 'AI助手';
            const userMessage = getLastUserMessage();

            if (!userMessage) {
                showToast('❌ 找不到对应的用户消息');

            const btn = message.querySelector('.btn-regenerate');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '⏳ 生成中...';
            }

            try {
                showToast(`⏳ 正在重新生成 ${girlfriendName} 的回复...`);

                const response = await fetch(`${API_URL}/api/mobile/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        expertId: girlfriendId,
                        userId: currentUserId,
                        mes: userMessage,
                        retry: true
                    })
                });

                const result = await response.json();
                if (result.success && result.content) {
                    // 更新界面
                    message.dataset.content = result.content;
                    message.querySelector('.message-bubble').textContent = result.content;
                    showToast('✅ 重新生成成功');
                } else {
                    showToast('❌ 生成失败：' + (result.error || '未知错误'));
                }
            } catch (error) {
                console.error('重新生成失败:', error);
                showToast('❌ 生成失败：' + error.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '🔄 重新生成';
                }
            }
        }

        // 重新生成群聊消息
        async function regenerateGroupMessage(msgId) {
            const message = document.querySelector(`[data-msg-id="${msgId}"]`);
            if (!message) return;

            const sender = message.dataset.sender;
            const groupId = message.dataset.groupId;
            const btn = message.querySelector('.btn-regenerate');

            if (!currentGroupId) {
                showToast('❌ 未找到群组信息');
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '⏳ 生成中...';
            }

            try {
                showToast(`⏳ 正在重新生成 ${sender} 的回复...`);

                // 获取群组信息
                const group = groups.find(g => g.id === currentGroupId);
                if (!group) {
                    showToast('❌ 找不到群组信息');
                    return;
                }

                // 找到对应的角色ID
                const member = group.members.find(m => m.name === sender);
                if (!member) {
                    showToast('❌ 找不到角色信息');
                    return;
                }

                // 获取最后一条用户消息
                const lastUserMsg = getLastGroupUserMessage();
                if (!lastUserMsg) {
                    showToast('❌ 找不到用户消息');
                    return;
                }

                // 临时移除该角色的旧回复，重新调用群聊API
                message.style.opacity = '0.5';

                // 构建请求数据
                const requestData = {
                    user_id: currentUserId,
                    message: lastUserMsg,
                    mentioned_girlfriends: [member.id],  // 只@该角色，让它重新回复
                    stream: false  // 使用非流式响应
                };

                const response = await fetch(`${API_URL}/groups/${currentGroupId}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    const data = await response.json();

                    // 查找该角色的新回复
                    if (data.ai_responses && data.ai_responses.length > 0) {
                        const newReply = data.ai_responses.find(r => r.girlfriend_name === sender);
                        if (newReply) {
                            // 更新界面
                            message.dataset.content = newReply.response;
                            message.querySelector('.message-bubble').textContent = newReply.response;
                            message.style.opacity = '1';
                            showToast('✅ 重新生成成功');
                        } else {
                            showToast('❌ 未找到该角色的回复');
                            message.style.opacity = '1';
                        }
                    } else {
                        showToast('❌ 生成失败：无回复内容');
                        message.style.opacity = '1';
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('重新生成失败:', error);
                showToast('❌ 生成失败：' + error.message);
                message.style.opacity = '1';
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '🔄 重新生成';
                }
            }
        }

            updateMessageCount();

            sendBtn.disabled = false;
            messageInput.focus();

            try {
                setStatus('loading', 'AI正在回复...');

                const response = await fetch(`${API_URL}/groups/${currentGroupId}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

                        group_id: currentGroupId,
                        message: content,  // 发送原始消息（不含@）
                        user_id: currentUserId,
                        mentioned_girlfriends: mentionedGirlfriends.map(g => g.girlfriend_id)  // 单独发送艾特列表
                    })
                });

                if (response.ok) {
                    const data = await response.json();

                    // 显示 AI 回应 - 使用更自然的延迟
                    if (data.ai_responses && data.ai_responses.length > 0) {
                        // 随机延迟范围：1-3秒，模拟真实聊天
                        const displayResponses = async () => {
                            for (let i = 0; i < data.ai_responses.length; i++) {
                                const resp = data.ai_responses[i];
                                // 第一个回复1秒后显示，后续每个回复随机延迟1.5-3秒
                                const delay = i === 0 ? 1000 : 1500 + Math.random() * 1500;
                                await new Promise(resolve => setTimeout(resolve, delay));
                                addGroupMessage('assistant', resp.girlfriend_name, resp.response);
                            }
                            setStatus('connected', '已连接');
                        };

                        // 异步显示回复，不阻塞用户输入
                        displayResponses();
                    } else {
                        setStatus('connected', '已连接');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('发送群聊消息失败:', error);
                addGroupMessage('assistant', '系统', '发送失败: ' + error.message);
                setStatus('disconnected', '连接失败');
            }
        }

                    // 添加模型参数
                    if (selectedModel) {

                        if (customApiPath) {
                            requestBody.apiPath = customApiPath;

                    response = await fetch(`${API_URL}/api/mobile/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',

                        body: JSON.stringify(requestBody)
                    });

                    if (response.ok) {
                        data = await response.json();

                        if (data.success) {
                            addMessage('assistant', data.content);
                            setStatus('connected', '已连接');
                        } else {
                            throw new Error(data.error || '未知错误');
                        }
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                } else {
                    // 使用原有API
                    response = await fetch(`${API_URL}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            messages: [{ role: 'user', content: content }],
                            userId: currentUserId,
                            expertId: currentGirlfriendId,
                            session_id: currentSessionId
                        })
                    });

                    if (response.ok) {
                        data = await response.json();

                        if (data.session_id) {
                            currentSessionId = data.session_id;
                            saveSessionState(currentGirlfriendId, currentSessionId);
                            if (!girlfriendChats[currentGirlfriendId]) {
                                girlfriendChats[currentGirlfriendId] = {};
                            }
                            girlfriendChats[currentGirlfriendId].sessionId = currentSessionId;
                        }

                        addMessage('assistant', data.reply);
                        setStatus('connected', '已连接');
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                console.error('错误详情:', JSON.stringify(error, null, 2));

                // 显示更友好的错误信息
                let errorText = '抱歉，发送失败了';
                if (error.message) {
                    errorText += '：' + error.message;
                } else {
                    errorText += '，请查看控制台了解详情';
                }
                addMessage('assistant', errorText);
                setStatus('disconnected', '连接失败');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                typingIndicator.classList.remove('active');
                messageInput.focus();
            }
        }

        // ============= 群组设置菜单功能 =============

        // 设置菜单按钮点击事件
        const groupSettingsBtn = document.getElementById('groupSettingsBtn');
        const groupSettingsMenu = document.getElementById('groupSettingsMenu');

        groupSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            groupSettingsMenu.classList.toggle('show');
        });

        // 点击其他地方关闭菜单
        document.addEventListener('click', () => {
            groupSettingsMenu.classList.remove('show');
        });

        // 下拉菜单项点击事件
        groupSettingsMenu.addEventListener('click', async (e) => {
            const item = e.target.closest('.dropdown-item');
            if (!item) return;

            const action = item.dataset.action;
            groupSettingsMenu.classList.remove('show');

            switch (action) {
                case 'clear':
                    await clearGroupHistory();
                    break;
                case 'rename':
                    showRenameGroupModal();
                    break;
                case 'members':
                    showManageMembersModal();
                    break;
                case 'delete':
                    await deleteGroup(currentGroupId, currentGroupName);
                    break;

        // 清空群组聊天记录
        async function clearGroupHistory() {
            if (!confirm(`确定要清空群组"${currentGroupName}"的聊天记录吗？`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/groups/${currentGroupId}/clear`, {
                    method: 'POST'
                });

                if (response.ok) {
                    // 清空界面
                    messagesContainer.innerHTML = '';
                    messageCount = 0;
                    updateMessageCount();
                    addGroupMessage('assistant', '系统', '聊天记录已清空');
                } else {
                    alert('清空聊天记录失败');
                }
            } catch (error) {
                console.error('清空聊天记录失败:', error);
                alert('清空聊天记录失败');
            }
        }

        // 更改群名模态框
        const renameGroupModal = document.getElementById('renameGroupModal');
        const closeRenameGroupModal = document.getElementById('closeRenameGroupModal');
        const cancelRenameGroupBtn = document.getElementById('cancelRenameGroupBtn');
        const confirmRenameGroupBtn = document.getElementById('confirmRenameGroupBtn');
        const renameGroupNameInput = document.getElementById('renameGroupNameInput');

        function showRenameGroupModal() {
            renameGroupNameInput.value = currentGroupName.replace('👥 ', '');
            renameGroupModal.classList.add('active');
            renameGroupNameInput.focus();
        }

        closeRenameGroupModal.addEventListener('click', () => {
            renameGroupModal.classList.remove('active');
        });

        cancelRenameGroupBtn.addEventListener('click', () => {
            renameGroupModal.classList.remove('active');
        });

        confirmRenameGroupBtn.addEventListener('click', async () => {
            const newName = renameGroupNameInput.value.trim();
            if (!newName) {
                alert('请输入新的群组名称');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/groups/${currentGroupId}/name`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });

                if (response.ok) {
                    currentGroupName = newName;
                    chatName.textContent = `👥 ${newName}`;
                    renameGroupModal.classList.remove('active');
                    await loadGroups(); // 更新群组列表
                    alert('群名修改成功！');
                } else {
                    alert('修改群名失败');
                }
            } catch (error) {
                console.error('修改群名失败:', error);
                alert('修改群名失败');
            }
        });

        // 点击模态框外部关闭
        renameGroupModal.addEventListener('click', (e) => {
            if (e.target === renameGroupModal) {
                renameGroupModal.classList.remove('active');
            }
        });

        // 管理成员模态框
        const manageMembersModal = document.getElementById('manageMembersModal');
        const closeManageMembersModal = document.getElementById('closeManageMembersModal');
        const cancelManageMembersBtn = document.getElementById('cancelManageMembersBtn');
        const currentMembersList = document.getElementById('currentMembersList');
        const availableMembersList = document.getElementById('availableMembersList');

        function showManageMembersModal() {
            // 获取当前群组
            const group = groups.find(g => g.group_id === currentGroupId);
            if (!group) return;

            // 渲染当前成员
            currentMembersList.innerHTML = '';
            group.members.forEach(memberId => {
                const gf = girlfriends.find(g => g.girlfriend_id === memberId);
                if (gf) {
                    const memberDiv = document.createElement('div');
                    memberDiv.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #f0f0f0;';
                    memberDiv.innerHTML = `
                        <span>${gf.name}</span>
                        <button class="remove-member-btn" data-member-id="${memberId}" style="padding: 4px 8px; background: #fee; border: 1px solid #fcc; border-radius: 4px; cursor: pointer; color: #c33; font-size: 12px;">移除</button>
                    `;
                    currentMembersList.appendChild(memberDiv);
                }
            });

            // 渲染可添加的成员（非当前群组成员）
            availableMembersList.innerHTML = '';
            girlfriends.forEach(gf => {
                if (!group.members.includes(gf.girlfriend_id)) {
                    const label = document.createElement('label');
                    label.style.cssText = 'display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer;';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = gf.girlfriend_id;
                    checkbox.style.cssText = 'margin-right: 10px;';

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(gf.name));
                    availableMembersList.appendChild(label);
                }
            });

            manageMembersModal.classList.add('active');
        }

        // 当前成员列表 - 移除成员事件
        currentMembersList.addEventListener('click', async (e) => {
            if (e.target.classList.contains('remove-member-btn')) {
                const memberId = e.target.dataset.memberId;
                const memberName = e.target.parentElement.querySelector('span').textContent;

                if (!confirm(`确定要将 ${memberName} 移出群组吗？`)) {
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/groups/${currentGroupId}/members/${memberId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        // 刷新成员列表
                        showManageMembersModal();
                        // 更新群组列表
                        await loadGroups();
                        // 更新头部成员数量
                        const group = groups.find(g => g.group_id === currentGroupId);
                        if (group) {
                            chatStatus.textContent = `${group.members.length} 个成员`;
                        }
                    } else {
                        alert('移除成员失败');
                    }
                } catch (error) {
                    console.error('移除成员失败:', error);
                    alert('移除成员失败');
                }
            }
        });

        // 可用成员列表 - 添加成员
        const addSelectedMembersBtn = document.createElement('button');
        addSelectedMembersBtn.textContent = '添加选中成员';
        addSelectedMembersBtn.className = 'btn btn-confirm';
        addSelectedMembersBtn.style.cssText = 'margin-top: 10px; width: 100%;';

        availableMembersList.parentNode.insertBefore(addSelectedMembersBtn, availableMembersList.nextSibling);

        addSelectedMembersBtn.addEventListener('click', async () => {
            const selectedCheckboxes = availableMembersList.querySelectorAll('input:checked');
            if (selectedCheckboxes.length === 0) {
                alert('请选择要添加的成员');
                return;
            }

            for (const checkbox of selectedCheckboxes) {
                const memberId = checkbox.value;
                try {
                    const response = await fetch(`${API_URL}/groups/${currentGroupId}/members`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ girlfriend_id: memberId })
                    });

                    if (!response.ok) {
                        alert(`添加成员失败`);
                        return;
                    }
                } catch (error) {
                    console.error('添加成员失败:', error);
                    alert('添加成员失败');
                    return;
                }
            }

            // 刷新成员列表
            showManageMembersModal();
            // 更新群组列表
            await loadGroups();
            // 更新头部成员数量
            const group = groups.find(g => g.group_id === currentGroupId);
            if (group) {
                chatStatus.textContent = `${group.members.length} 个成员`;
            }
        });

        closeManageMembersModal.addEventListener('click', () => {
            manageMembersModal.classList.remove('active');
        });

        cancelManageMembersBtn.addEventListener('click', () => {
            manageMembersModal.classList.remove('active');
        });

        // 点击模态框外部关闭
        manageMembersModal.addEventListener('click', (e) => {
            if (e.target === manageMembersModal) {
                manageMembersModal.classList.remove('active');
            }
        });

        // ============= @功能相关代码 =============

        // @按钮点击事件
        mentionBtn.addEventListener('click', () => {
            openMentionModal();
        });

        // 打开@角色选择弹窗
        function openMentionModal() {
            if (!currentGroupId) {
                alert('请先选择群组');
                return;
            }

            // 获取当前群组信息
            const currentGroup = groups.find(g => g.group_id === currentGroupId);
            if (!currentGroup) {
                alert('群组信息不存在');
                return;
            }

            // 每次打开弹窗时，清空之前的@选择，让用户重新选择
            mentionedGirlfriends = [];
            updateMentionedTags();

            // 渲染群组成员列表
            mentionCharacterList.innerHTML = '';
            currentGroup.members.forEach(memberId => {
                const gf = girlfriends.find(g => g.girlfriend_id === memberId);
                if (!gf) return;

                // 检查是否已经被@
                const isMentioned = mentionedGirlfriends.some(m => m.girlfriend_id === gf.girlfriend_id);

                const item = document.createElement('div');
                item.style.cssText = 'padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 10px;';
                item.innerHTML = `
                    <input type="checkbox" value="${gf.girlfriend_id}" ${isMentioned ? 'checked' : ''} style="width: 18px; height: 18px;">
                    <div style="flex: 1;">
                        <div style="font-weight: 500;">${gf.name}</div>
                        <div style="font-size: 12px; color: #999;">${gf.is_system ? '系统女友' : '自定义女友'}</div>
                    </div>
                `;
                mentionCharacterList.appendChild(item);
            });

            mentionModal.classList.add('active');
        }

        // 确认@选择
        confirmMentionBtn.addEventListener('click', () => {
            const checkedBoxes = mentionCharacterList.querySelectorAll('input:checked');

            // 更新已@的角色列表
            mentionedGirlfriends = [];
            checkedBoxes.forEach(cb => {
                const gf = girlfriends.find(g => g.girlfriend_id === cb.value);
                if (gf) {
                    mentionedGirlfriends.push({
                        girlfriend_id: gf.girlfriend_id,
                        name: gf.name
                    });
                }
            });

            // 更新显示
            updateMentionedTags();

            // 关闭弹窗
            mentionModal.classList.remove('active');
        });

        // 取消@选择
        cancelMentionBtn.addEventListener('click', () => {
            mentionModal.classList.remove('active');
        });

        // 关闭@弹窗
        closeMentionModal.addEventListener('click', () => {
            mentionModal.classList.remove('active');
        });

        // 点击弹窗外部关闭
        mentionModal.addEventListener('click', (e) => {
            if (e.target === mentionModal) {
                mentionModal.classList.remove('active');
            }
        });

        // 更新@标签显示
        function updateMentionedTags() {
            // 清空下方标签显示
            mentionedTags.innerHTML = '';

            if (mentionedGirlfriends.length > 0) {
                // 有@的角色时，按钮显示高亮效果
                mentionBtn.classList.add('has-mentions');
            } else {
                mentionBtn.classList.remove('has-mentions');
            }

            // 在输入框的光标位置插入 @角色名
            if (mentionedGirlfriends.length > 0) {
                mentionedGirlfriends.forEach(gf => {
                    insertAtCursor(messageInput, `@${gf.name} `);
                });
            }
        }

        // 在光标位置插入文本
        function insertAtCursor(textarea, text) {
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const value = textarea.value;

            textarea.value = value.substring(0, startPos) + text + value.substring(endPos);

            // 设置光标位置到插入文本之后
            const newPos = startPos + text.length;
            textarea.setSelectionRange(newPos, newPos);
            textarea.focus();

            // 触发input事件以确保任何相关监听器被调用
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // 修改selectGroup函数，显示/隐藏@按钮
        const originalSelectGroup = selectGroup;
        selectGroup = function(group) {
            // 调用原始函数
            originalSelectGroup(group);

            // 显示@按钮（群聊模式）
            mentionBtn.style.display = 'flex';

            // 清空之前的@选择
            mentionedGirlfriends = [];
            updateMentionedTags();
        };

        // 修改selectGirlfriend函数，隐藏@按钮
        const originalSelectGirlfriend = selectGirlfriend;
        selectGirlfriend = function(gf) {
            // 调用原始函数
            originalSelectGirlfriend(gf);

            // 隐藏@按钮（私聊模式）
            mentionBtn.style.display = 'none';

            // 清空@选择
            mentionedGirlfriends = [];
            updateMentionedTags();
        };

        // 修改sendGroupMessage函数，使用SSE接收流式回复
        const originalSendGroupMessage = sendGroupMessage;
        sendGroupMessage = async function(content) {
            // 立即显示用户消息
            const time = formatTime(new Date());

            // 直接使用输入内容，@mentions已经通过insertAtCursor添加到content中了
            restoreGroupMessage('user', '用户', content, time);

            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 立即清空艾特状态
            const tempMentions = [...mentionedGirlfriends];  // 保存副本用于发送
            mentionedGirlfriends = [];
            updateMentionedTags();

            // 清空输入框并允许继续输入
            messageCount++;
            updateMessageCount();
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();

            try {
                setStatus('loading', 'AI正在回复...');

                // 构建请求数据，包含@的角色列表
                const requestData = {
                    user_id: currentUserId,
                    message: content,
                    mentioned_girlfriends: tempMentions.map(g => g.girlfriend_id)
                };

                console.log('发送群聊消息（SSE模式）:', requestData);

                // 使用 fetch POST 请求
                const response = await fetch(`${API_URL}/groups/${currentGroupId}/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                // 处理 SSE 流
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                let responseCount = 0;  // 跟踪回复数量

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';  // 保留最后一个不完整的行

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            try {
                                const event = JSON.parse(data);

                                if (event.name || event.girlfriend_name) {
                                    // AI 回复事件
                                    responseCount++;
                                    const aiTime = formatTime(new Date(event.message.timestamp));
                                    const name = event.name || event.girlfriend_name;  // 兼容两种字段名
                                    restoreGroupMessage('assistant', name, event.response, aiTime);
                                    console.log(`收到回复 ${responseCount}:`, name);

                                    // 收到回复后滚动到底部
                                    setTimeout(() => scrollToBottom(true), 50);
                                } else if (event.success) {
                                    // 完成事件
                                    console.log('SSE 流完成');
                                    setStatus('connected', '已连接');
                                } else if (event.error) {
                                    // 错误事件
                                    console.error('SSE 错误:', event.error);
                                    addMessage('assistant', '抱歉，发生错误：' + event.error);
                                    setStatus('disconnected', '连接失败');
                                }
                            } catch (e) {
                                console.error('解析 SSE 数据失败:', e, data);
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('发送消息失败:', error);
                console.error('错误详情:', JSON.stringify(error, null, 2));

                // 显示更友好的错误信息
                let errorText = '抱歉，发送失败了';
                if (error.message) {
                    errorText += '：' + error.message;
                } else {
                    errorText += '，请查看控制台了解详情';
                }
                addMessage('assistant', errorText);
                setStatus('disconnected', '连接失败');
            }

            // 清空@选择（发送后）
            mentionedGirlfriends = [];
            updateMentionedTags();
        };

        // 页面加载时初始化
        window.addEventListener('load', init);

        // 定期检查连接状态
        setInterval(checkConnection, 30000);
    </script>
